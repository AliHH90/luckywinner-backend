# ===========================
#  SERVER
# ===========================
server.port=31000
server.address=0.0.0.0

# ===========================
#  DATABASE CONFIG
# ===========================
spring.datasource.url=jdbc:mysql://localhost:3306/luckywinnerdb?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
#spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===========================
#  JPA / HIBERNATE
# ===========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
#spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect


# ===========================
#  UTF-8 Settings
# ===========================
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# ===========================
#  JWT SETTINGS
# ===========================
app.jwt.secret=THIS_IS_A_LONG_SECURE_SECRET_KEY_2025_XYZ123
app.jwt.expiration=86400000

